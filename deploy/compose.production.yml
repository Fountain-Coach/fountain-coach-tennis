services:
  tennis-app:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - /etc/tennis/tennis.env
    expose:
      - "8787"
    volumes:
      - tennis-production-data:/var/lib/tennis
    networks:
      - tennis-production

  tennis-edge:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - tennis-app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.production:/etc/caddy/Caddyfile:ro
      - tennis-production-caddy-data:/data
      - tennis-production-caddy-config:/config
    networks:
      - tennis-production

volumes:
  tennis-production-data:
  tennis-production-caddy-data:
  tennis-production-caddy-config:

networks:
  tennis-production:
